name: Rust and PostgreSQL contracts
on: [push, pull_request]
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Provision pinned pgRDF PostgreSQL fixture
        env:
          PGRDF_SHA256: 78b9efa983bc5b494f163a7896cd2260314830ac166e8ab2b04e549f91852b8f
        run: |
          set -euo pipefail
          context="$(mktemp -d "${RUNNER_TEMP}/tectd-pgrdf.XXXXXXXX")"
          cp containers/postgres/Dockerfile "$context/Dockerfile"
          archive="$context/pgrdf-0.6.34-pg18-glibc-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/styk-tv/pgRDF/releases/download/v0.6.34/pgrdf-0.6.34-pg18-glibc-amd64.tar.gz
          printf '%s  %s\n' "$PGRDF_SHA256" "$archive" | sha256sum --check --status
          image="tectd-ci-postgres:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --platform linux/amd64 --tag "$image" "$context"
          container="tectd-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm --detach --name "$container" \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=tect_test \
            "$image"
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U postgres -d tect_test >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" psql -U postgres -d tect_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE tect_ci LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT PASSWORD 'ci-fixture-only'"
          published="$(docker port "$container" 5432/tcp)"
          port="${published##*:}"
          {
            echo "TECT_TEST_ADMIN_URL=postgres://postgres:postgres@127.0.0.1:${port}/tect_test"
            echo "TECT_TEST_RUNTIME_URL=postgres://tect_ci:ci-fixture-only@127.0.0.1:${port}/tect_test"
            echo 'TECT_TEST_RUNTIME_ROLE=tect_ci'
          } >> "$GITHUB_ENV"
      - run: python3 scripts/check-architecture.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Remove CI PostgreSQL fixture
        if: always()
        run: |
          docker rm --force "tectd-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          docker image rm "tectd-ci-postgres:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
