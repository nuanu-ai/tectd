name: Rust and PostgreSQL contracts
on: [push, pull_request]
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tect_test
        ports: ["5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TECT_TEST_RUNTIME_ROLE: tect_ci
      TECT_TEST_NATIVE_CONTRACT_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Provision isolated CI runtime role
        env:
          PGPASSWORD: postgres
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: psql -h 127.0.0.1 -p "$PGPORT" -U postgres -d tect_test -v ON_ERROR_STOP=1 -c "CREATE ROLE tect_ci LOGIN NOSUPERUSER NOBYPASSRLS NOINHERIT PASSWORD 'ci-fixture-only'"
      - run: python3 scripts/check-architecture.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Bootstrap isolated CI application schema and runtime grants
        env:
          TECT_ADMIN_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tect_test"
        run: cargo run --locked -p tect-cli --bin tect-admin -- migrate --runtime-role "$TECT_TEST_RUNTIME_ROLE"
      - run: cargo test --workspace
        env:
          TECT_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tect_test"
          TECT_TEST_RUNTIME_URL: "postgres://tect_ci:ci-fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/tect_test"
