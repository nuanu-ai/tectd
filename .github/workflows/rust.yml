name: Rust and PostgreSQL contracts
on: [push, pull_request]
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64]
    env:
      TECT_TEST_RUNTIME_ROLE: tect_ci
      TECT_TEST_NATIVE_CONTRACT_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Provision isolated canonical PostgreSQL fixture
        run: python3 scripts/ci-postgres-fixture.py start "$RUNNER_TEMP/tectd-pg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json"
      - run: python3 scripts/check-architecture.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Remove this job's PostgreSQL fixture
        if: always()
        run: python3 scripts/ci-postgres-fixture.py cleanup "$RUNNER_TEMP/tectd-pg-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}.json"
