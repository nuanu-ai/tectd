[workspace]
members = ["crates/domain", "crates/application", "crates/postgres", "crates/host", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
tect-domain = { path = "crates/domain" }
tect-application = { path = "crates/application" }
tect-postgres = { path = "crates/postgres" }
tect-host = { path = "crates/host" }
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "migrate", "macros", "json"] }
sha2 = "0.10"
url = "2"
percent-encoding = "2"
oxrdf = "=0.3.3"
rustix = { version = "=1.1.4", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
